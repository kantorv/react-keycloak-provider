name: tests

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - 'feature/*'
      - 'hotfix/*'


env:
  # CHROME_VERSION: "128.0.6613.137"
  # CHROME_VERSION: "142.0.7444.61" # Selenium tests
  CHROME_VERSION: "150.0.7871.24" 
  KEYCLOAK_VERSION: "26.4" # Selenium tests

jobs:
  run-tests:
    if: ${{ !contains(github.event.head_commit.message, '--skip-ci') }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Load chrome from cache
        id: chrome
        uses: actions/cache@v5
        with:
          path: /tmp/chrome-linux64.zip
          key: ${{ env.CHROME_VERSION }}

      - name: load chrome
        if: steps.chrome.outputs.cache-hit != 'true'
        run: |
          wget https://storage.googleapis.com/chrome-for-testing-public/${{ env.CHROME_VERSION }}/linux64/chrome-linux64.zip -O /tmp/chrome-linux64.zip

      - name: Load chromedriver from cache
        id: chromedriver
        uses: actions/cache@v4
        with:
          path: /tmp/chromedriver-linux64.zip
          key: ${{ env.CHROME_VERSION }}

      - name: load chromedriver
        if: steps.chromedriver.outputs.cache-hit != 'true'
        run: |
          wget https://storage.googleapis.com/chrome-for-testing-public/${{ env.CHROME_VERSION }}/linux64/chromedriver-linux64.zip -O /tmp/chromedriver-linux64.zip

      - name: unzip chrome assets
        run: |
          unzip /tmp/chrome-linux64.zip -d /tmp
          unzip /tmp/chromedriver-linux64.zip -d /tmp
          # ensure chrome assets exists
          [[ -f /tmp/chromedriver-linux64/chromedriver  ]] || exit 1  
          [[ -f /tmp/chrome-linux64/chrome  ]] || exit 1  






      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Load keycloak image from cache
        id: keycloakimagestable
        uses: actions/cache@v5
        with:
          path: /tmp/keycloakimagestable.tar
          key: keycloakimage-stable-${{ env.KEYCLOAK_VERSION }}

      - name: Add keycloak image to cache
        if: steps.keycloakimagestable.outputs.cache-hit != 'true'
        run: |
          docker pull quay.io/keycloak/keycloak:${{ env.KEYCLOAK_VERSION }}
          docker save -o /tmp/keycloakimagestable.tar quay.io/keycloak/keycloak:${{ env.KEYCLOAK_VERSION }}
      - name: load keycloakimagestable
        run: |
          docker image load -i  /tmp/keycloakimagestable.tar --platform=linux/amd64



      # - name: Pull keycloak image
      #   run: docker pull quay.io/keycloak/keycloak:latest



#      - name: Login to Docker Hub
#        uses: docker/login-action@v3
#        with:
#          username: ${{ secrets.DOCKER_HUB_USERNAME }}
#          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}



      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: git config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip' # caching pip dependencies

      - name: install packages
        run: pip install -r ci/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'


      - name: Update npm  
        run: npm install -g npm@latest

      - name: Install dependencies
        run: yarn install

      # - name: Run tests
      #   run: yarn test --ci

      # python3 -m http.server 3000 --bind localhost  --directory ./build



      # Give this run's tarball a version no other run has used.
      #
      # `yarn add <tarball>` caches by name@version, and the yarn cache is restored
      # across runs by setup-node's `cache: 'yarn'`. release-it only bumps the version
      # on merge to development, so every feature-branch run used to pack DIFFERENT
      # contents under the SAME 2.1.0 — and yarn served whichever 2.1.0 it had cached
      # first, silently testing stale code. A unique version makes that collision
      # impossible. Not committed or tagged: --no-git-tag-version only edits
      # package.json in the runner's checkout.
      - name: Bump version for this run
        run: |
          _base=`jq --raw-output .version package.json`
          yarn version --new-version "${_base}-rc.${{ github.run_number }}.${{ github.run_attempt }}" --no-git-tag-version
          jq --raw-output .version package.json

      - name: Build
        run: yarn build
        env:
          CI: false
          # Workaround for: "Treating warnings as errors because process.env.CI = true".


      - name: Pack
        run: yarn pack

      # The demo app installs the packed tarball rather than the sources, because
      # tests have passed against source and still failed once installed from a package.
      - name: Setup demo app
        run: |
          yarn create react-app demo-app --template typescript > /dev/null 2>&1
          cp -f ./ci/tests/index.tsx ./ci/tests/App.tsx ./demo-app/src
          cp ./ci/tests/silent-check-sso.html ./demo-app/public/silent-check-sso.html
          _version=`cat package.json | jq  --raw-output .version`
          _name=`cat package.json | jq  --raw-output .name`
          _package="$(pwd)/${_name}-v${_version}.tgz"
          test -f "$_package" || { echo "::error::packed tarball not found: $_package"; exit 1; }
          cd demo-app
          # belt and braces: never let a cached entry for this package satisfy the add
          yarn cache clean "$_name" > /dev/null 2>&1 || true
          yarn add $_package
          # Prove the tarball is what got installed. A cache hit would leave an older
          # version here, and the failure would otherwise surface as a confusing type
          # error against stale .d.ts forty lines later.
          _installed=`jq --raw-output .version node_modules/${_name}/package.json`
          test "$_installed" = "$_version" \
            || { echo "::error::installed ${_name}@${_installed}, expected ${_version} - a stale copy satisfied the add"; exit 1; }
          yarn build

        env:
          CI: false
          
      - name: Start Demo App
        run: |
          cd demo-app
          yarn start &

      - name: Start Keycloak
        run: |
          cd ci
          bash run.sh

      - name: Run tests
        run: |
          cd ci/tests
          python tests.py