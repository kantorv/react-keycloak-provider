name: Feature branch updated

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - 'feature/*'
      - 'hotfix/*'


env:
  CHROME_VERSION: "128.0.6613.137" # Selenium tests

jobs:
  run-tests:
    if: ${{ !contains(github.event.head_commit.message, '--skip-ci') }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Load chrome from cache
        id: chrome
        uses: actions/cache@v4
        with:
          path: /tmp/chrome-linux64.zip
          key: ${{ env.CHROME_VERSION }}

      - name: load chrome
        if: steps.chrome.outputs.cache-hit != 'true'
        run: |
          wget https://storage.googleapis.com/chrome-for-testing-public/${{ env.CHROME_VERSION }}/linux64/chrome-linux64.zip -O /tmp/chrome-linux64.zip
          unzip /tmp/chrome-linux64.zip
          
      - name: Load chromedriver from cache
        id: chromedriver
        uses: actions/cache@v4
        with:
          path: /tmp/chromedriver-linux64.zip
          key: ${{ env.CHROME_VERSION }}

      - name: load chromedriver
        if: steps.chromedriver.outputs.cache-hit != 'true'
        run: |
          wget https://storage.googleapis.com/chrome-for-testing-public/${{ env.CHROME_VERSION }}/linux64/chromedriver-linux64.zip -O /tmp/chromedriver-linux64.zip
          unzip /tmp/chromedriver-linux64.zip
          

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull keycloak image
        run: docker pull quay.io/keycloak/keycloak:latest



#      - name: Login to Docker Hub
#        uses: docker/login-action@v3
#        with:
#          username: ${{ secrets.DOCKER_HUB_USERNAME }}
#          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}



      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # caching pip dependencies

      - name: install packages
        run: pip install -r ci/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'


      - name: Install dependencies
        run: yarn install

      # - name: Run tests
      #   run: yarn test --ci

      # python3 -m http.server 3000 --bind localhost  --directory ./build

      - name: Build
        run: yarn build